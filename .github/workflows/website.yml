name: Website

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve existing Pages project
        id: target
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Set production environment variable CLOUDFLARE_PAGES_PROJECT to the existing Pages project serving constellation-works.com" >&2
            exit 1
          fi
          printf 'project=%s\n' "$PAGES_PROJECT" >> "$GITHUB_OUTPUT"

      - name: Deploy static site
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.129.0"
          command: pages deploy public --project-name=${{ steps.target.outputs.project }} --branch=main --commit-hash=${{ github.sha }}

      - name: Verify deployment and custom domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PUBLIC_URL: https://constellation-works.com
        shell: bash
        run: |
          set -euo pipefail
          # Fetch a homepage and report one of: ok (marker found), challenged
          # (Cloudflare answered 403 with its own headers, i.e. the edge blocked
          # this runner rather than the site being missing), or miss.
          probe() {
            local url="$1" headers body status
            headers="$(mktemp)"
            # Buffer the response instead of piping into grep: grep -q exits on the
            # first match, curl then fails to write to the closed pipe (exit 23), and
            # pipefail would fail the check on a page that is actually correct.
            body="$(curl --silent --show-error --max-time 20 \
                      --user-agent "constellation-site-verify (github-actions)" \
                      --dump-header "$headers" --write-out '\n%{http_code}' "$url" || true)"
            status="${body##*$'\n'}"
            if printf '%s' "$body" | grep -Fq 'one front door.'; then
              echo ok
            elif [[ "$status" == 403 ]] && grep -Eiq '^(cf-mitigated|server: *cloudflare)' "$headers"; then
              echo challenged
            else
              echo miss
            fi
            rm -f "$headers"
          }
          verify_site() {
            local base_url="${1%/}" result
            for _ in {1..12}; do
              result="$(probe "$base_url/")"
              case "$result" in
                ok) return 0 ;;
                challenged)
                  # The custom domain is bound and served by Cloudflare, but its bot
                  # protection blocked the runner, so the page body cannot be checked
                  # here. The deployment URL above already verified the content.
                  # Allow-list the verify User-Agent in the zone's WAF to make this a
                  # real check again.
                  echo "::warning::$base_url answered 403 from Cloudflare's edge (bot protection); custom domain is bound but the body was not verified"
                  return 0 ;;
              esac
              sleep 5
            done
            echo "expected homepage did not reach $base_url" >&2
            return 1
          }
          test -n "$DEPLOYMENT_URL"
          verify_site "$DEPLOYMENT_URL"
          verify_site "$PUBLIC_URL"
